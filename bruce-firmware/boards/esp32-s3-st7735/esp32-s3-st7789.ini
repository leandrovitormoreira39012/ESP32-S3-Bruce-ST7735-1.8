; =========================================================================
; Configuração do Bruce Firmware para ESP32-S3 com ST7789 + Touch + SD + JY050
; =========================================================================

[env:esp32-s3-st7789]
board = esp32-s3-devkitc-1
board_build.partitions = default_16MB.csv

build_src_filter = ${env.build_src_filter} +<../boards/esp32-s3-st7789>

build_flags =
    ${env.build_flags}
    -Iboards/esp32-s3-st7789
    -Iinclude
    -Isrc
    -DUSB_as_HID=1

    -Os
    -DCORE_DEBUG_LEVEL=1
    -DREDRAW_DELAY=1
    -DALLOW_ALL_GPIO_FOR_IR_RF=1
    -DDISABLE_ALL_LIBRARY_WARNINGS

    ; Identificação da Placa
    -DESP32_S3_ST7789
    -DDEVICE_NAME='"ESP32-S3 Custom ST7789"'

    ; ---------------------------------------------------------------------
    ; Sistema de Entrada: Módulo JY050 (5 Vias + 2 Botões SET/RST)
    ; ---------------------------------------------------------------------
    -DHAS_5_BUTTONS
    -DINPUT_HANDLER_EXISTS=1
    -DUP_BTN=4
    -DDOWN_BTN=5
    -DLEFT_BTN=6
    -DRIGHT_BTN=7
    -DSEL_BTN=1
    -DBTN_SET=2
    -DBTN_RST=42

    ; ---------------------------------------------------------------------
    ; Barramento I2C Padrão (OLED 0.91" 128x32 secundário e expansões)
    ; ---------------------------------------------------------------------
    -DGROVE_SDA=18
    -DGROVE_SCL=8

    ; ---------------------------------------------------------------------
    ; Módulos Infravermelho (IR TX / RX)
    ; ---------------------------------------------------------------------
    -DIR_TX_PINS='{{"Pin TX 17", 17}}'
    -DIR_RX_PINS='{{"Pin RX 38", 38}}'
    -DIR_TX_PIN=17
    -DIR_RX_PIN=38
    -DTXLED=48
    -DLED_ON=HIGH
    -DLED_OFF=LOW

    ; ---------------------------------------------------------------------
    ; Mapeamento SPI Principal (FSPI) — Compartilhado (Tela, SD e Touch)
    ; ---------------------------------------------------------------------
    -DSPI_SCK_PIN=12
    -DSPI_MOSI_PIN=11
    -DSPI_MISO_PIN=13
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=16000000

    ; ---------------------------------------------------------------------
    ; Display ST7789 2.8" (240x320)
    ; ---------------------------------------------------------------------
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_RGB_ORDER=TFT_BGR
    -DSMOOTH_FONT=1
    -DTFT_CS=10
    -DTFT_DC=9
    -DTFT_RST=14
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_MISO=13
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DFB=2
    -DTFT_SPI_PORT=FSPI
    -DHAS_SCREEN=1
    -DROTATION=1
    -DMINBRIGHT=255

    ; ---------------------------------------------------------------------
    ; Touchscreen XPT2046 (Integrado na Tela)
    ; ---------------------------------------------------------------------
    -DHAS_TOUCH=1
    -DTOUCH_CS=15
    -DTOUCH_IRQ=16
    -DSPI_TOUCH_FREQUENCY=25000000

    ; ---------------------------------------------------------------------
    ; Cartão MicroSD (Integrado na Tela)
    ; ---------------------------------------------------------------------
    -DSDCARD_CS=40
    -DSDCARD_SCK=12
    -DSDCARD_MISO=13
    -DSDCARD_MOSI=11

    ; ---------------------------------------------------------------------
    ; Módulos de Rádio Frequência (CC1101 e NRF24L01)
    ; ---------------------------------------------------------------------
    -DUSE_CC1101_VIA_SPI
    -DCC1101_GDO0_PIN=3
    -DCC1101_SS_PIN=47
    -DCC1101_MOSI_PIN=11
    -DCC1101_SCK_PIN=12
    -DCC1101_MISO_PIN=13

    -DUSE_NRF24_VIA_SPI
    -DNRF24_CE_PIN=39
    -DNRF24_SS_PIN=41
    -DNRF24_MOSI_PIN=11
    -DNRF24_SCK_PIN=12
    -DNRF24_MISO_PIN=13

    ; ---------------------------------------------------------------------
    ; Monitor de Bateria
    ; ---------------------------------------------------------------------
    -DBAT_PIN=10

lib_deps = ${env.lib_deps}
